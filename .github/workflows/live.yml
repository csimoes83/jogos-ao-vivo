name: jogos ao vivo

on:
  schedule:
    # UTC. Todos os dias, das 9h às 23h (cobre os jogos de hoje e dos próximos dias; o operador só escreve perto de cada jogo).
    - cron: '*/5 9-23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = confirma permissões do token | probe = só lê (feeds + site) | dry = pede dry-run ao site | run = aplica'
        default: 'probe'
        type: choice
        options: [probe, check, dry, run]
      only:
        description: 'ids de jogos (opcional, separados por vírgula)'
        required: false
      ignore_window:
        description: 'ignorar a janela horária (só para testes em dry)'
        type: boolean
        default: false
      loop_seconds:
        description: 'repetir a verificação durante N segundos (vazio = uma só vez)'
        required: false

# uma execução de cada vez: a seguinte espera (e só fica uma à espera), por isso a vigilância é contínua e sem escritas em duplicado
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      actions: write   # para disparar a execução seguinte
    steps:
      - uses: actions/checkout@v4
      - name: Operar jogos
        id: operar
        env:
          NFP_MCP_TOKEN: ${{ secrets.NFP_MCP_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          ONLY: ${{ github.event.inputs.only }}
          IGNORE_WINDOW: ${{ github.event.inputs.ignore_window }}
          LOOP: ${{ github.event_name == 'schedule' && '330' || github.event.inputs.loop_seconds }}
        run: |
          args=(--mode "$MODE" --interval 20)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$IGNORE_WINDOW" = "true" ] && args+=(--ignore-window)
          [ -n "$LOOP" ] && args+=(--loop-seconds "$LOOP")
          python3 -I live.py "${args[@]}"
      # Enquanto houver jogos em vigilância, dispara já a execução seguinte (fica em fila até esta acabar):
      # a vigilância não depende de o relógio do GitHub chegar a horas. Fora dos jogos, é o relógio que recomeça tudo.
      - name: Continuar a vigilância
        if: always() && steps.operar.outputs.keepalive == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'run')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f mode=run -f loop_seconds=330

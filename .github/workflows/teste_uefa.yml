name: teste acesso UEFA
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Tentar uefa.com
        run: |
          for u in "https://www.uefa.com/uefafutsalchampionsleague/news/02a7-21341507f422-022664641dc6-1000--uefa-futsal-champions-league-main-round-groups/" "https://www.uefa.com/uefafutsalchampionsleague/match/"; do
            echo "== $u"
            curl -s -o /tmp/p.html -m 30 -A "Mozilla/5.0" -w "HTTP %{http_code} bytes %{size_download}\n" "$u" || echo "curl exit $?"
            head -c 300 /tmp/p.html | tr -d '\n' ; echo
          done
